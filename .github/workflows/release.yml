name: Build & Release Qin 1s+ Launcher Mod

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'
      release_notes:
        description: 'Release notes / Changelog'
        required: false
        default: 'שדרוג מסך הבית ל-Qin 1s+: תמיכה בריבוי עמודי ווידגטים, צפייה בלבד במסך הראשי, והסרה במקש תפריט.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies (zipalign)
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign

      - name: Build and Sign Modified APK
        run: |
          python - << 'EOF'
          import os, sys, subprocess, shutil, zipfile

          WORKSPACE = os.getcwd()
          BUILD_TMP = os.path.join(WORKSPACE, "build_tmp")
          TOOLS_DIR = os.path.join(WORKSPACE, "tools")
          
          ANDROID_JAR = os.path.join(TOOLS_DIR, "android-19", "android.jar")
          D8_JAR = os.path.join(TOOLS_DIR, "d8.jar")
          APKSIGNER_JAR = os.path.join(TOOLS_DIR, "apksigner.jar")
          APKTOOL_JAR = os.path.join(TOOLS_DIR, "apktool", "apktool.jar")
          FRAMEWORK_APK = os.path.join(TOOLS_DIR, "framework", "1.apk")
          KEYSTORE = os.path.join(WORKSPACE, "debug.keystore")
          
          OUTPUT_APK = os.path.join(WORKSPACE, "ClassicHome_Qin1s_v2_widgets.apk")
          
          os.makedirs(BUILD_TMP, exist_ok=True)
          classes_dir = os.path.join(BUILD_TMP, "classes")
          dex_dir = os.path.join(BUILD_TMP, "dex")
          os.makedirs(classes_dir, exist_ok=True)
          os.makedirs(dex_dir, exist_ok=True)

          # 0. Install DuoQin Framework into Apktool if exists
          if os.path.exists(FRAMEWORK_APK):
              print(f"[*] Installing DuoQin framework: {FRAMEWORK_APK}")
              subprocess.check_call(["java", "-jar", APKTOOL_JAR, "if", FRAMEWORK_APK])

          # 1. Compile Java helpers
          src_files = [
              os.path.join(WORKSPACE, "src", "com", "sprd", "classichome", "widget", "WidgetHostManager.java"),
              os.path.join(WORKSPACE, "src", "com", "sprd", "classichome", "mainmenu", "MainMenuWidgetHelper.java")
          ]
          print("[*] Compiling Java files...")
          subprocess.check_call([
              "javac", "-source", "1.8", "-target", "1.8", "-encoding", "utf-8",
              "-bootclasspath", ANDROID_JAR,
              "-cp", os.path.join(WORKSPACE, "src"),
              "-d", classes_dir
          ] + src_files)

          # 2. D8 to dex
          print("[*] Running D8...")
          class_files = []
          for root, dirs, files in os.walk(classes_dir):
              for f in files:
                  if f.endswith(".class"):
                      class_files.append(os.path.join(root, f))
          
          subprocess.check_call([
              "java", "-cp", D8_JAR, "com.android.tools.r8.D8",
              "--min-api", "19",
              "--lib", ANDROID_JAR,
              "--output", dex_dir
          ] + class_files)

          # 3. Disassemble DEX to Smali
          print("[*] Converting DEX to Smali...")
          dex_file = os.path.join(dex_dir, "classes.dex")
          dummy_apk = os.path.join(BUILD_TMP, "dummy.apk")
          with zipfile.ZipFile(dummy_apk, "w") as z:
              z.write(dex_file, "classes.dex")
              z.write(os.path.join(WORKSPACE, "apktool_out", "AndroidManifest.xml"), "AndroidManifest.xml")

          smali_temp = os.path.join(BUILD_TMP, "smali_out")
          subprocess.check_call(["java", "-jar", APKTOOL_JAR, "d", dummy_apk, "-o", smali_temp, "-r", "-f"])

          # Copy smali
          src_smali_root = os.path.join(smali_temp, "smali")
          dest_smali_root = os.path.join(WORKSPACE, "apktool_out", "smali")
          for root, dirs, files in os.walk(src_smali_root):
              for f in files:
                  if f.endswith(".smali"):
                      rel = os.path.relpath(os.path.join(root, f), src_smali_root)
                      dest = os.path.join(dest_smali_root, rel)
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      shutil.copy2(os.path.join(root, f), dest)

          # 4. Build APK with apktool
          print("[*] Building APK with apktool...")
          unsigned_apk = os.path.join(BUILD_TMP, "unsigned.apk")
          subprocess.check_call(["java", "-jar", APKTOOL_JAR, "b", os.path.join(WORKSPACE, "apktool_out"), "-o", unsigned_apk])

          # 5. Zipalign
          print("[*] Running zipalign...")
          aligned_apk = os.path.join(BUILD_TMP, "aligned.apk")
          subprocess.check_call(["zipalign", "-p", "-f", "4", unsigned_apk, aligned_apk])

          # 6. Generate Keystore if not exists
          if not os.path.exists(KEYSTORE):
              print("[*] Creating debug keystore...")
              subprocess.check_call([
                  "keytool", "-genkeypair", "-v",
                  "-keystore", KEYSTORE,
                  "-storepass", "android",
                  "-alias", "androiddebugkey",
                  "-keypass", "android",
                  "-keyalg", "RSA",
                  "-keysize", "2048",
                  "-validity", "10000",
                  "-dname", "CN=Android Debug,O=Android,C=US"
              ])

          # 7. Sign APK
          print("[*] Signing APK...")
          subprocess.check_call([
              "java", "-jar", APKSIGNER_JAR, "sign",
              "--ks", KEYSTORE,
              "--ks-pass", "pass:android",
              "--ks-key-alias", "androiddebugkey",
              "--key-pass", "pass:android",
              "--out", OUTPUT_APK,
              aligned_apk
          ])

          print(f"[SUCCESS] Built signed APK: {OUTPUT_APK}")
          print(f"Size: {os.path.getsize(OUTPUT_APK)} bytes")
          EOF

      - name: Generate Tag & Release Version
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_name }}"
            NOTES="${{ github.event.inputs.release_notes }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NOTES="Release $TAG"
          else
            TAG="v2.0.$(date +'%Y%m%d%H%M')"
            NOTES="עדכון אוטומטי של מסך הבית ל-Qin 1s+ עם תמיכה בווידג'טים וריבוי עמודים."
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "NOTES=$NOTES" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.TAG }}
          name: Qin 1s+ ClassicHome Mod ${{ steps.release_meta.outputs.TAG }}
          body: |
            ## 📱 שדרוג מסך הבית - Qin 1s / 1s+ (ClassicHome Mod)
            
            ${{ steps.release_meta.outputs.NOTES }}
            
            ### 🌟 פיצ'רים עיקריים:
            - **תמיכה בווידג'טים**: הוספת ווידג'טים מכל אפליקציה מותקנת דרך לחיצה ארוכה בתפריט היישומים.
            - **מסך ראשי (עמוד 0)**: ווידג'ט במצב צפייה בלבד (ללא חסימת פוקוס/קיצורים).
            - **ריבוי עמודים דינמי**: מעבר חלק בין עמודים בלחיצה על מקש **סולמית (`#`)**, וחזרה לעמוד הראשי במקש **חזור (Back)**.
            - **הסרת ווידג'טים נוחה**: לחיצה על מקש **Menu (מקש שמאלי)** בעמודי הווידג'טים פותחת תפריט הסרה מהיר.
            
            ---
            ### 📥 הורדה והתקנה:
            הורד את קובץ ה-`ClassicHome_Qin1s_v2_widgets.apk` המצורף והתקן ישירות במכשיר.
          files: |
            ClassicHome_Qin1s_v2_widgets.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
